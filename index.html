

<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>RW-34 Developer</title>

<style>

body{font-family:Arial;background:#10151e;color:white;padding:20px}

h1{color:#35d3e5}

button{background:#167b91;color:white;border:0;border-radius:12px;padding:15px;margin:5px;font-size:16px}

pre{background:#202b39;padding:14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;direction:ltr;text-align:left}

</style>

</head>

<body>

<h1>RW-34 Developer</h1>

<p id="status">غير متصل</p>

<button onclick="connect()">اتصال بالساعة</button>

<button onclick="download()">حفظ البيانات</button>

<button onclick="clearLog()">مسح السجل</button>

<h3>Bluetooth Live Data</h3>

<pre id="log">جاهز...</pre>

<script>

const UART="6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const TX="6e400003-b5a3-f393-e0a9-e50e24dcca9e";

let device,characteristic;

let records=[];

function log(s){

 records.push(new Date().toISOString()+" "+s);

 document.getElementById("log").textContent=records.join("\n");

}

function hex(data){

 return [...new Uint8Array(data.buffer,data.byteOffset,data.byteLength)]

 .map(x=>x.toString(16).padStart(2,"0")).join(" ").toUpperCase();

}

async function connect(){

 try{

 if(!navigator.bluetooth)throw Error("Web Bluetooth غير مدعوم");

 device=await navigator.bluetooth.requestDevice({

  filters:[{name:"RW-34"}],

  optionalServices:[UART]

 });

 device.addEventListener("gattserverdisconnected",()=>{

  document.getElementById("status").textContent="انقطع الاتصال";

  log("Disconnected");

 });

 let server=await device.gatt.connect();

 let service=await server.getPrimaryService(UART);

 characteristic=await service.getCharacteristic(TX);

 characteristic.addEventListener("characteristicvaluechanged",e=>{

  log("RX: "+hex(e.target.value));

 });

 await characteristic.startNotifications();

 document.getElementById("status").textContent="متصل: "+device.name;

 log("Connected and notifications enabled");

 }catch(e){log("Error: "+e.message);}

}

function clearLog(){

 records=[];

 document.getElementById("log").textContent="تم المسح";

}

function download(){

 const blob=new Blob([records.join("\n")],{type:"text/plain"});

 const url=URL.createObjectURL(blob);

 const a=document.createElement("a");

 a.href=url;a.download="rw34-log.txt";a.click();

 setTimeout(()=>URL.revokeObjectURL(url),1000);

}

</script>

</body>

</html>
