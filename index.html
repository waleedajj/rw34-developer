<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RW-34 Developer</title><style>body{font-family:system-ui;background:#101722;color:#eef4ff;margin:0;padding:20px}main{max-width:760px;margin:auto}button{background:#377cff;color:white;border:0;border-radius:12px;padding:13px;margin:5px;cursor:pointer}button:disabled{opacity:.45}section{background:#1d293a;border-radius:16px;padding:16px;margin:15px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;direction:ltr;text-align:left;max-height:330px;overflow:auto}small{color:#b8c8df}</style></head><body><main><h1>RW-34 Developer</h1><small>BLE read-only diagnostic console • v1.0</small><section><p id="status">غير متصل</p><button id="connect">بحث واتصال</button><button id="disconnect" disabled>قطع الاتصال</button><button id="export">تصدير السجل</button><button id="clear">مسح السجل</button></section><section><h3>الخدمات والخصائص</h3><pre id="services">—</pre></section><section><h3>البيانات الواردة (HEX)</h3><pre id="log">—</pre></section><small>يحتاج متصفحاً يدعم Web Bluetooth وHTTPS. لا يرسل هذا التطبيق أوامر للساعة.</small></main><script>
const NUS='6e400001-b5a3-f393-e0a9-e50e24dcca9e';let device,server,records=[];const $=id=>document.getElementById(id);const show=(s)=>$('status').textContent=s;const add=(s)=>{records.push(new Date().toISOString()+' '+s);$('log').textContent=records.join('\n');};const hex=a=>Array.from(a,b=>b.toString(16).padStart(2,'0')).join(' ').toUpperCase();
async function connect(){try{if(!navigator.bluetooth){show('Web Bluetooth غير مدعوم في هذا المتصفح');return;}show('جارٍ اختيار الجهاز…');device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[NUS,'6e400011-b5a3-f393-e0a9-e50e24dcca9e','00000000-0000-0000-6473-5f696c666973']});device.addEventListener('gattserverdisconnected',()=>{show('انقطع الاتصال');$('disconnect').disabled=true;});server=await device.gatt.connect();show('متصل: '+(device.name||'Unknown'));$('disconnect').disabled=false;let lines=[];for(const service of await server.getPrimaryServices()){lines.push('SERVICE '+service.uuid);for(const characteristic of await service.getCharacteristics()){lines.push('  '+characteristic.uuid+' [notify='+characteristic.properties.notify+', indicate='+characteristic.properties.indicate+']');if(characteristic.properties.notify||characteristic.properties.indicate){try{await characteristic.startNotifications();characteristic.addEventListener('characteristicvaluechanged',e=>{const v=e.target.value;add(e.target.uuid+' : '+hex(new Uint8Array(v.buffer,v.byteOffset,v.byteLength)));});lines.push('    subscribed');}catch(err){lines.push('    subscribe error: '+err.message);}}}}$('services').textContent=lines.join('\n');}catch(err){show('خطأ: '+err.message);add('ERROR '+err.message);}}
$('connect').onclick=connect;$('disconnect').onclick=()=>{if(device?.gatt?.connected)device.gatt.disconnect();};$('clear').onclick=()=>{records=[];$('log').textContent='—';};$('export').onclick=()=>{const blob=new Blob([records.join('\n')],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='rw34-ble-log.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></body></html>
